<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Manager - Reports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            background-color: #333;
            color: white;
            padding: 15px;
            margin: 0;
            text-align: center;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
        }

        .navbar a:hover {
            background-color: #575757;
            border-radius: 5px;
        }

        .container {
            padding: 20px;
        }

        .sort-buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        .sort-buttons a button {
            background-color: #28a745;
            color: white;
            margin: 5px;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .sort-buttons a button:hover {
            background-color: #1e7e34;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Music Manager - Reports</h1>


    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/" id="homeBtn">Add/Edit/Delete</a>
        <a href="/reports" id="reportsBtn">Reports</a>
        <a href="/aggregation" id="aggregationBtn">Aggregation</a>
    </div>


    <div class="container">
        <h2>Reports Section</h2>

        <!-- Sort Buttons -->
        <div class="sort-buttons">
            <a href="/reports?sort=band_name"><button>Sort by Band Name</button></a>
            <a href="/reports?sort=title"><button>Sort by Album Title</button></a>
            <a href="/reports?sort=release_year"><button>Sort by Release Year</button></a>
            <a href="/reports?sort=band_country"><button>Sort by Band Country</button></a>
        </div>

        <!-- Report Table -->
        <div id="reportContent">
            <table>
                <thead>
                    <tr>
                        <th>Band Name</th>
                        <th>Country</th>
                        <th>Album Title</th>
                        <th>Release Year</th>
                    </tr>
                </thead>
                <tbody>
                    {% for band, album in data %}
                    <tr>
                        <td>{{ band.name }}</td>
                        <td>{{ band.country }}</td>
                        <td>{{ album.title }}</td>
                        <td>{{ album.release_year }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
